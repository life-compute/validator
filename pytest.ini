[pytest]
testpaths = tests
pythonpath = . tests
addopts = -q
# NOTE: the validator venv ships anchorpy, whose pytest11 entry point
# imports pytest_asyncio (not installed).  Run the suite with
# PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 (see run_tests.sh) — this suite needs no
# third-party plugins.
markers =
    replay: replays recorded audit rows through the new verdict path
